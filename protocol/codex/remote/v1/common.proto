syntax = "proto3";

package codex.remote.v1;

option go_package = "github.com/kylin1993/codex-remote/protocol/gen/go/codex/remote/v1;remotev1";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// Completeness is attached to any value that may be bounded while preserving
// enough information for a client to render an honest partial result.
message Completeness {
  bool truncated = 1;
  bool incomplete = 2;
  uint64 original_size_bytes = 3;
  string reason = 4;
}

message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message PageInfo {
  string next_page_token = 1;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  uint64 retry_after_ms = 4;
  map<string, string> metadata = 5;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_DEADLINE_EXCEEDED = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_CONFLICT = 4;
  ERROR_CODE_INTERNAL_ERROR = 5;

  ERROR_CODE_HOST_NOT_READY = 10;
  ERROR_CODE_RUNTIME_UNAVAILABLE = 11;
  ERROR_CODE_CAPABILITY_NOT_SUPPORTED = 12;

  ERROR_CODE_DIRECTORY_NOT_FOUND = 20;
  ERROR_CODE_DIRECTORY_NOT_ACCESSIBLE = 21;
  ERROR_CODE_DIRECTORY_CREATE_FAILED = 22;

  ERROR_CODE_SESSION_NOT_FOUND = 30;
  ERROR_CODE_SESSION_NOT_RESUMABLE = 31;
  ERROR_CODE_SESSION_IMPORT_FAILED = 32;
  ERROR_CODE_LIVE_SESSION_CONCURRENCY_UNSUPPORTED = 33;

  ERROR_CODE_CODEX_NOT_FOUND = 40;
  ERROR_CODE_TURN_ALREADY_RUNNING = 41;
  ERROR_CODE_TURN_NOT_RUNNING = 42;

  ERROR_CODE_APPROVAL_NOT_FOUND = 50;
  ERROR_CODE_APPROVAL_ALREADY_RESOLVED = 51;
  ERROR_CODE_USER_INPUT_REQUEST_NOT_FOUND = 52;
  ERROR_CODE_USER_INPUT_ALREADY_RESOLVED = 53;
}

enum HostStatus {
  HOST_STATUS_UNSPECIFIED = 0;
  HOST_STATUS_STARTING = 1;
  HOST_STATUS_READY = 2;
  HOST_STATUS_DEGRADED = 3;
  HOST_STATUS_STOPPING = 4;
}

enum RuntimeStatus {
  RUNTIME_STATUS_UNSPECIFIED = 0;
  RUNTIME_STATUS_STARTING = 1;
  RUNTIME_STATUS_READY = 2;
  RUNTIME_STATUS_RESTARTING = 3;
  RUNTIME_STATUS_UNAVAILABLE = 4;
  RUNTIME_STATUS_STOPPED = 5;
}

enum CodexStatus {
  CODEX_STATUS_UNSPECIFIED = 0;
  CODEX_STATUS_IDLE = 1;
  CODEX_STATUS_RUNNING = 2;
  CODEX_STATUS_WAITING_FOR_APPROVAL = 3;
  CODEX_STATUS_WAITING_FOR_USER_INPUT = 4;
  CODEX_STATUS_INTERRUPTING = 5;
  CODEX_STATUS_UNAVAILABLE = 6;
  CODEX_STATUS_ERROR = 7;
}

enum CodexOrigin {
  CODEX_ORIGIN_UNSPECIFIED = 0;
  CODEX_ORIGIN_REMOTE_CREATED = 1;
  CODEX_ORIGIN_LOCAL_EXISTING = 2;
}

enum SessionAvailability {
  SESSION_AVAILABILITY_UNSPECIFIED = 0;
  SESSION_AVAILABILITY_RESUMABLE = 1;
  SESSION_AVAILABILITY_ALREADY_MANAGED = 2;
  SESSION_AVAILABILITY_POSSIBLY_LIVE_ELSEWHERE = 3;
  SESSION_AVAILABILITY_NOT_RESUMABLE = 4;
}

enum TurnStatus {
  TURN_STATUS_UNSPECIFIED = 0;
  TURN_STATUS_RUNNING = 1;
  TURN_STATUS_COMPLETED = 2;
  TURN_STATUS_FAILED = 3;
  TURN_STATUS_INTERRUPTED = 4;
}

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_RUNNING = 1;
  ITEM_STATUS_COMPLETED = 2;
  ITEM_STATUS_FAILED = 3;
  ITEM_STATUS_CANCELLED = 4;
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_ALLOWED = 2;
  APPROVAL_STATUS_DENIED = 3;
  APPROVAL_STATUS_CANCELLED = 4;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_ALLOW = 1;
  APPROVAL_DECISION_ALLOW_FOR_SESSION = 2;
  APPROVAL_DECISION_DENY = 3;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
  OUTPUT_STREAM_COMBINED = 3;
}

enum WarningCode {
  WARNING_CODE_UNSPECIFIED = 0;
  WARNING_CODE_LIVE_SESSION_CONCURRENCY_RISK = 1;
  WARNING_CODE_HISTORY_IMPORT_INCOMPLETE = 2;
  WARNING_CODE_AUDIT_DEGRADED = 3;
  WARNING_CODE_RUNTIME_RESTARTED = 4;
}

enum ProvenanceKind {
  PROVENANCE_KIND_UNSPECIFIED = 0;
  PROVENANCE_KIND_LIVE_WIRE = 1;
  PROVENANCE_KIND_IMPORTED_HISTORY = 2;
  PROVENANCE_KIND_HOST_SYNTHESIZED = 3;
}
