syntax = "proto3";

package codex.remote.v1;

import "codex/remote/v1/common.proto";
import "codex/remote/v1/event.proto";
import "codex/remote/v1/model.proto";
import "codex/remote/v1/rpc.proto";

option go_package = "github.com/kylin1993/codex-remote/protocol/gen/go/codex/remote/v1;remotev1";

message Frame {
  oneof payload {
    ClientHello client_hello = 1;
    ServerHello server_hello = 2;
    Request request = 3;
    Response response = 4;
    Event event = 5;
    Ping ping = 6;
    Pong pong = 7;
    Close close = 8;
  }
}

message ClientHello {
  string client_id = 1;
  string client_run_id = 2;
  ProtocolVersion protocol_version = 3;
  string client_name = 4;
  string client_version = 5;
}

message ServerHello {
  string connection_id = 1;
  string host_id = 2;
  string host_run_id = 3;
  ProtocolVersion protocol_version = 4;
  string host_version = 5;
  HostStatus host_status = 6;
  RuntimeInfo runtime = 7;
  Capabilities capabilities = 8;
  uint64 heartbeat_interval_ms = 9;
  uint64 connection_timeout_ms = 10;
  uint64 max_frame_bytes = 11;
}

message Ping {
  uint64 nonce = 1;
  int64 sent_at_unix_ms = 2;
}

message Pong {
  uint64 nonce = 1;
  int64 ping_sent_at_unix_ms = 2;
  int64 pong_sent_at_unix_ms = 3;
}

message Close {
  CloseCode code = 1;
  string message = 2;
  bool reconnect_allowed = 3;
  uint64 retry_after_ms = 4;
}

enum CloseCode {
  CLOSE_CODE_UNSPECIFIED = 0;
  CLOSE_CODE_NORMAL = 1;
  CLOSE_CODE_SERVER_SHUTDOWN = 2;
  CLOSE_CODE_PROTOCOL_VERSION_UNSUPPORTED = 10;
  CLOSE_CODE_HELLO_REQUIRED = 11;
  CLOSE_CODE_INVALID_FRAME = 12;
  CLOSE_CODE_FRAME_TOO_LARGE = 13;
  CLOSE_CODE_CONNECTION_TIMEOUT = 14;
  CLOSE_CODE_SLOW_CONSUMER = 15;
  CLOSE_CODE_INTERNAL_PROTOCOL_ERROR = 16;
}
