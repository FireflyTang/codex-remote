syntax = "proto3";

package codex.remote.v1;

import "codex/remote/v1/common.proto";
import "codex/remote/v1/model.proto";

option go_package = "github.com/kylin1993/codex-remote/protocol/gen/go/codex/remote/v1;remotev1";

message Request {
  string request_id = 1;
  int64 sent_at_unix_ms = 2;
  int64 deadline_unix_ms = 3;

  oneof request {
    GetHostRequest get_host = 10;
    ListDirectoriesRequest list_directories = 20;
    ListSessionCandidatesRequest list_session_candidates = 21;
    ListCodexesRequest list_codexes = 30;
    CreateCodexRequest create_codex = 31;
    ImportSessionRequest import_session = 32;
    WatchCodexRequest watch_codex = 33;
    UnwatchCodexRequest unwatch_codex = 34;
    ListHistoryRequest list_history = 35;
    StartTurnRequest start_turn = 40;
    InterruptTurnRequest interrupt_turn = 41;
    RespondApprovalRequest respond_approval = 42;
    RespondUserInputRequest respond_user_input = 43;
  }
}

message Response {
  string request_id = 1;
  int64 responded_at_unix_ms = 2;

  oneof result {
    GetHostResponse get_host = 10;
    ListDirectoriesResponse list_directories = 20;
    ListSessionCandidatesResponse list_session_candidates = 21;
    ListCodexesResponse list_codexes = 30;
    CreateCodexResponse create_codex = 31;
    ImportSessionResponse import_session = 32;
    WatchCodexResponse watch_codex = 33;
    UnwatchCodexResponse unwatch_codex = 34;
    ListHistoryResponse list_history = 35;
    StartTurnResponse start_turn = 40;
    InterruptTurnResponse interrupt_turn = 41;
    RespondApprovalResponse respond_approval = 42;
    RespondUserInputResponse respond_user_input = 43;
    Error error = 100;
  }
}

message GetHostRequest {}

message GetHostResponse {
  HostInfo host = 1;
  Capabilities capabilities = 2;
}

message ListDirectoriesRequest {
  string parent_path = 1;
  PageRequest page = 2;
}

message ListDirectoriesResponse {
  string parent_path = 1;
  repeated DirectoryEntry directories = 2;
  PageInfo page = 3;
}

message ListSessionCandidatesRequest {
  string cwd = 1;
  PageRequest page = 2;
}

message ListSessionCandidatesResponse {
  string normalized_cwd = 1;
  repeated SessionCandidate sessions = 2;
  PageInfo page = 3;
}

message ListCodexesRequest {
  PageRequest page = 1;
}

message ListCodexesResponse {
  repeated Codex codexes = 1;
  PageInfo page = 2;
}

message CreateCodexRequest {
  string cwd = 1;
  bool create_directory_if_missing = 2;
  string title = 3;
}

message CreateCodexResponse {
  Codex codex = 1;
  bool directory_created = 2;
  bool deduplicated = 3;
}

message ImportSessionRequest {
  string session_id = 1;
  string source = 2;
}

message ImportSessionResponse {
  Codex codex = 1;
  bool already_managed = 2;
  bool history_complete = 3;
  bool deduplicated = 4;
  repeated Warning warnings = 5;
}

message WatchCodexRequest {
  string codex_id = 1;
  optional uint64 after_event_seq = 2;
  string after_host_run_id = 3;
}

message WatchCodexResponse {
  string codex_id = 1;
  WatchMode mode = 2;
  uint64 head_event_seq = 3;
  uint64 replay_from_event_seq = 4;
  CurrentView reset_view = 5;
  WatchResetReason reset_reason = 6;
}

enum WatchMode {
  WATCH_MODE_UNSPECIFIED = 0;
  WATCH_MODE_RESUMED = 1;
  WATCH_MODE_RESET = 2;
}

enum WatchResetReason {
  WATCH_RESET_REASON_UNSPECIFIED = 0;
  WATCH_RESET_REASON_INITIAL_WATCH = 1;
  WATCH_RESET_REASON_HOST_RESTARTED = 2;
  WATCH_RESET_REASON_CURSOR_UNAVAILABLE = 3;
  WATCH_RESET_REASON_CURSOR_INVALID = 4;
}

message UnwatchCodexRequest {
  string codex_id = 1;
}

message UnwatchCodexResponse {
  string codex_id = 1;
}

message ListHistoryRequest {
  string codex_id = 1;
  PageRequest page = 2;
}

message ListHistoryResponse {
  HistoryPage history = 1;
}

message StartTurnRequest {
  string codex_id = 1;
  repeated UserInputPart input = 2;
  TurnOptions options = 3;
}

message StartTurnResponse {
  string turn_id = 1;
  bool deduplicated = 2;
}

message InterruptTurnRequest {
  string codex_id = 1;
  string turn_id = 2;
}

message InterruptTurnResponse {
  string turn_id = 1;
  bool deduplicated = 2;
}

message RespondApprovalRequest {
  string codex_id = 1;
  string approval_id = 2;
  ApprovalDecision decision = 3;
}

message RespondApprovalResponse {
  Approval approval = 1;
  bool deduplicated = 2;
}

message RespondUserInputRequest {
  string codex_id = 1;
  string user_input_request_id = 2;
  reserved 3;
  repeated UserInputAnswer answers = 4;
}

message RespondUserInputResponse {
  UserInputRequestState request = 1;
  bool deduplicated = 2;
}
