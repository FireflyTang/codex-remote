syntax = "proto3";

package codex.remote.v1;

import "codex/remote/v1/common.proto";
import "codex/remote/v1/model.proto";

option go_package = "github.com/kylin1993/codex-remote/protocol/gen/go/codex/remote/v1;remotev1";

message Event {
  string codex_id = 1;
  uint64 event_seq = 2;
  int64 occurred_at_unix_ms = 3;
  string caused_by_request_id = 4;
  Completeness completeness = 5;

  oneof event {
    CodexUpdated codex_updated = 10;
    TurnUpdated turn_updated = 11;
    ItemStarted item_started = 20;
    ItemDelta item_delta = 21;
    ItemUpdated item_updated = 22;
    ItemCompleted item_completed = 23;
    PendingRequestUpdated pending_request_updated = 30;
    WarningRaised warning_raised = 40;
  }
}

message CodexUpdated {
  Codex codex = 1;
}

message TurnUpdated {
  string turn_id = 1;
  TurnStatus status = 2;
  int64 started_at_unix_ms = 3;
  int64 completed_at_unix_ms = 4;
  Error failure = 5;
}

message ItemStarted {
  Item item = 1;
}

message ItemDelta {
  string turn_id = 1;
  string item_id = 2;
  uint64 chunk_seq = 3;

  oneof delta {
    string text = 10;
    CommandOutputDelta command_output = 11;
  }
}

message CommandOutputDelta {
  OutputStream stream = 1;
  string text = 2;
}

message ItemUpdated {
  Item item = 1;
}

message ItemCompleted {
  Item item = 1;
}

message PendingRequestUpdated {
  PendingRequest request = 1;
}

message WarningRaised {
  Warning warning = 1;
}
